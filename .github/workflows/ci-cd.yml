name: CI/CD — CertifyVal Full Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Soroban Smart Contract Tests ────────────────────────────────────
  smart-contract-tests:
    name: "🦀 Smart Contract CI — cargo test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contract/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/**/Cargo.lock') }}

      - name: Run all Soroban unit tests
        run: cargo test --workspace
        working-directory: contract

  # ── Job 2: Frontend CI — npm install + build ────────────────────────────────
  frontend-ci:
    name: "⚡ Frontend CI — npm install & build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build Next.js production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

  # ── Job 3: CD — Verify Deployment to Vercel Production ─────────────────────
  # Vercel auto-deploys via GitHub Git Integration on every push to main.
  # This job confirms the deployment URL and validates the live site is reachable.
  deploy-production:
    name: "🚀 CD — Verify Vercel Production Deployment"
    runs-on: ubuntu-latest
    needs: [smart-contract-tests, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm Deployment Target
        run: |
          echo "==========================================="
          echo "  CertifyVal — Production Deployment"
          echo "==========================================="
          echo "  Platform  : Vercel (via Git Integration)"
          echo "  Project   : digital-certificate-validator-full-project"
          echo "  Live URL  : https://certifyval.vercel.app"
          echo "  Branch    : ${{ github.ref_name }}"
          echo "  Commit    : ${{ github.sha }}"
          echo "  Triggered : ${{ github.event_name }}"
          echo "==========================================="
          echo "Vercel auto-deployment triggered by this push."

      - name: Wait for Vercel deployment to propagate
        run: sleep 15

      - name: Validate live site is reachable (smoke test)
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://certifyval.vercel.app)
          echo "Live site HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Deployment confirmed — site is live at https://certifyval.vercel.app"
          else
            echo "⚠️  Site returned HTTP $HTTP_STATUS — Vercel may still be deploying."
            exit 0
          fi
